services:
  db:
    image: postgres:16
    container_name: timeblock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: timeblock
      POSTGRES_PASSWORD: timeblock_password
      POSTGRES_DB: timeblock_db
    ports:
      - "5432:5432"
    volumes:
      - timeblock_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeblock -d timeblock_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timeblock-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://timeblock:timeblock_password@db:5432/timeblock_db?schema=app
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  timeblock_postgres_data:
